<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پایه نهم - آموزش زیست</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'IRANSans', Tahoma, sans-serif;
            background: linear-gradient(135deg, #e8eaf6, #c5cae9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(40, 40, 100, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #3949ab;
            font-weight: 600;
            font-size: 1rem;
            background: #e8eaf6;
            padding: 10px 22px;
            border-radius: 60px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #3949ab;
            color: #fff;
            transform: translateX(-4px);
        }

        .page-title {
            font-size: 1.8rem;
            color: #283593;
            font-weight: 800;
        }

        .page-title span {
            background: #e8eaf6;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            color: #5c6bc0;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 320px;
            margin: 30px auto 10px;
            gap: 18px;
        }

        .chapter-btn {
            display: block;
            text-decoration: none;
            background: #ffffff;
            padding: 26px 20px;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            border: 2px solid #3949ab;
            transition: all 0.3s ease;
            color: #1a237e;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .chapter-btn:hover {
            transform: translateY(-6px) scale(1.02);
            background: #f5f6ff;
            box-shadow: 0 16px 40px rgba(57, 73, 171, 0.25);
        }

        .chapter-btn .ch-num {
            display: block;
            font-size: 0.85rem;
            color: #7986cb;
            font-weight: 400;
            margin-top: 6px;
        }

        .chapter-btn .arrow-icon {
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.3s ease;
        }

        .chapter-btn:hover .arrow-icon {
            transform: translateX(8px);
        }

        .footer {
            margin-top: 36px;
            font-size: 0.8rem;
            color: #7986cb;
            border-top: 1px solid #d5d9e8;
            padding-top: 18px;
        }

        .coming-badge {
            display: inline-block;
            font-size: 0.65rem;
            background: #e8eaf6;
            color: #3949ab;
            padding: 2px 14px;
            border-radius: 30px;
            margin-top: 6px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 16px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .page-title {
                font-size: 1.4rem;
            }

            .chapter-grid {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="top-bar">
            <a href="index.html" class="back-btn">→ بازگشت</a>
            <div class="page-title">
                🧪 پایه نهم
                <span>علوم تجربی</span>
            </div>
        </div>

        <h3 style="color:#5c6bc0; font-weight:500; margin-bottom:6px;">فصل‌های آموزشی</h3>

        <div class="chapter-grid">
            <a href="#" class="chapter-btn" style="opacity:0.6; cursor:not-allowed; pointer-events:none; border-color:#ccc;">
                فصل ۱
                <span class="ch-num">در حال ساخت</span>
                <span class="coming-badge">به زودی</span>
            </a>
        </div>

        <div class="footer">
            استاد نوروزی‌نژاد · آموزش زیست
        </div>

    </div>
</body>
</html>
