<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فصل پنجم - پایه هفتم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'IRANSans', Tahoma, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 35px;
            box-shadow: 0 30px 80px rgba(0, 40, 20, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ===== نوار بالا ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #1a5a3a;
            font-weight: 600;
            font-size: 1rem;
            background: #e6f2ea;
            padding: 10px 22px;
            border-radius: 60px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #1a7a4a;
            color: #fff;
            transform: translateX(-4px);
        }

        .page-title {
            font-size: 1.5rem;
            color: #1a5a3a;
            font-weight: 800;
        }

        .page-title small {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #6b8f7a;
        }

        /* ===== ویدئو ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            /* نسبت 16:9 */
            border-radius: 24px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== توضیحات پایین ویدئو ===== */
        .video-caption {
            margin-top: 20px;
            text-align: center;
            color: #3d6b4f;
            font-size: 1rem;
            background: #e6f2ea;
            padding: 14px 20px;
            border-radius: 20px;
            font-weight: 500;
        }

        .video-caption span {
            display: inline-block;
            background: #1a7a4a;
            color: #fff;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            margin-right: 8px;
        }

        /* ===== فوتر ===== */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #7a9a86;
            border-top: 1px solid #d9ebe2;
            padding-top: 18px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 14px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .page-title {
                font-size: 1.2rem;
            }

            .video-caption {
                font-size: 0.85rem;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== نوار بالا ===== -->
        <div class="top-bar">
            <a href="7.html" class="back-btn">→ بازگشت به پایه هفتم</a>
            <div class="page-title">
                📖 فصل پنجم
                <small>از معدن تا خانه · بخش اول</small>
            </div>
        </div>

        <!-- ===== ویدئوی آپارات ===== -->
        <div class="video-wrapper">
            <iframe 
                src="https://www.aparat.com/video/video/embed/videohash/yih9j82/vt/frame?titleShow=true&startTime=0" 
                allowFullScreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true">
            </iframe>
        </div>

        <!-- ===== توضیحات ===== -->
        <div class="video-caption">
            🎯 آموزش فصل پنجم علوم پایه هفتم — بخش اول
            <span>استاد نوروزی‌نژاد</span>
        </div>

        <div class="footer">
            تمامی حقوق محفوظ است · استاد نوروزی‌نژاد
        </div>

    </div>
</body>
</html>
