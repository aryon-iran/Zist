<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پایه هفتم - آموزش زیست</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'IRANSans', Tahoma, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 40, 20, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ===== هدر ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #1a5a3a;
            font-weight: 600;
            font-size: 1rem;
            background: #e6f2ea;
            padding: 10px 22px;
            border-radius: 60px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #1a7a4a;
            color: #fff;
            transform: translateX(-4px);
        }

        .page-title {
            font-size: 1.8rem;
            color: #1a5a3a;
            font-weight: 800;
        }

        .page-title span {
            background: #e6f2ea;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            color: #3d6b4f;
        }

        /* ===== دکمه‌های فصل ===== */
        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin: 30px 0 10px;
        }

        .chapter-btn {
            display: block;
            text-decoration: none;
            background: #ffffff;
            padding: 22px 16px;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            color: #1e3c2c;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .chapter-btn:hover {
            transform: translateY(-6px);
            border-color: #1a7a4a;
            background: #fafffd;
            box-shadow: 0 16px 40px rgba(26, 90, 58, 0.18);
        }

        .chapter-btn .ch-num {
            display: block;
            font-size: 0.75rem;
            color: #7a9a86;
            font-weight: 400;
            margin-top: 4px;
        }

        .chapter-btn .arrow-icon {
            display: inline-block;
            margin-right: 6px;
            transition: transform 0.3s ease;
        }

        .chapter-btn:hover .arrow-icon {
            transform: translateX(6px);
        }

        /* ===== وضعیت در حال ساخت ===== */
        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(0.4);
        }

        .coming-soon .badge {
            display: inline-block;
            font-size: 0.65rem;
            background: #ddd;
            color: #888;
            padding: 2px 12px;
            border-radius: 30px;
            margin-top: 6px;
        }

        /* ===== فوتر ===== */
        .footer {
            margin-top: 36px;
            font-size: 0.8rem;
            color: #7a9a86;
            border-top: 1px solid #d9ebe2;
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 16px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .page-title {
                font-size: 1.4rem;
            }

            .chapter-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== نوار بالا ===== -->
        <div class="top-bar">
            <a href="index.html" class="back-btn">→ بازگشت</a>
            <div class="page-title">
                🌱 پایه هفتم
                <span>علوم تجربی</span>
            </div>
        </div>

        <!-- ===== دکمه‌های فصل‌ها ===== -->
        <h3 style="color:#3d6b4f; font-weight:500; margin-bottom:6px;">فصل‌های آموزشی</h3>

        <div class="chapter-grid">
            <!-- فصل ۵ (فعال) -->
            <a href="F5.html" class="chapter-btn">
                فصل ۵
                <span class="ch-num">از معدن تا خانه</span>
                <span class="arrow-icon">←</span>
            </a>

            <!-- فصل‌های دیگر (در حال ساخت) -->
            <a href="#" class="chapter-btn coming-soon">
                فصل ۱
                <span class="ch-num">در حال ساخت</span>
                <span class="badge">به زودی</span>
            </a>

            <a href="#" class="chapter-btn coming-soon">
                فصل ۲
                <span class="ch-num">در حال ساخت</span>
                <span class="badge">به زودی</span>
            </a>

            <a href="#" class="chapter-btn coming-soon">
                فصل ۳
                <span class="ch-num">در حال ساخت</span>
                <span class="badge">به زودی</span>
            </a>

            <a href="#" class="chapter-btn coming-soon">
                فصل ۴
                <span class="ch-num">در حال ساخت</span>
                <span class="badge">به زودی</span>
            </a>

            <a href="#" class="chapter-btn coming-soon">
                فصل ۶
                <span class="ch-num">در حال ساخت</span>
                <span class="badge">به زودی</span>
            </a>
        </div>

        <div class="footer">
            استاد نوروزی‌نژاد · آموزش زیست
        </div>

    </div>
</body>
</html>
