<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آموزش زیست - استاد نوروزی‌نژاد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'IRANSans', Tahoma, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 40, 20, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .header {
            margin-bottom: 40px;
        }

        .header .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 6px;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: #1a5a3a;
            letter-spacing: -0.5px;
        }

        .header .sub {
            font-size: 1.2rem;
            color: #3d6b4f;
            background: #e6f2ea;
            display: inline-block;
            padding: 6px 28px;
            border-radius: 60px;
            margin-top: 8px;
            font-weight: 500;
        }

        .header .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #1a7a4a, #a8d5b8);
            margin: 16px auto 0;
            border-radius: 4px;
        }

        .grade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin: 36px 0 10px;
        }

        .grade-card {
            background: #ffffff;
            padding: 32px 20px 26px;
            border-radius: 28px;
            text-decoration: none;
            color: #1e3c2c;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .grade-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(26, 90, 58, 0.2);
            border-color: #1a7a4a;
            background: #fafffd;
        }

        .grade-card .emoji {
            font-size: 2.8rem;
        }

        .grade-card .label {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a5a3a;
        }

        .grade-card .desc {
            font-size: 0.9rem;
            color: #6b8f7a;
            font-weight: 400;
        }

        .grade-card .arrow {
            font-size: 1.2rem;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        .grade-card:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* ===== فوتر جدید ===== */
        .footer {
            margin-top: 40px;
            padding-top: 22px;
            border-top: 1px solid #d9ebe2;
        }

        .footer .credit {
            font-size: 0.85rem;
            color: #7a9a86;
            line-height: 1.8;
        }

        .footer .credit .name {
            font-weight: 700;
            color: #1a5a3a;
            font-size: 0.95rem;
        }

        .footer .credit .brand {
            display: inline-block;
            background: linear-gradient(135deg, #1a7a4a, #2e9b6a);
            color: #fff;
            padding: 2px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 18px;
            }

            .header h1 {
                font-size: 1.7rem;
            }

            .grade-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .grade-card {
                padding: 24px;
                flex-direction: row;
                justify-content: center;
                gap: 16px;
            }

            .grade-card .arrow {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <span class="icon">🧬</span>
            <h1>آموزش زیست</h1>
            <div class="sub">با استاد نوروزی‌نژاد</div>
            <div class="divider"></div>
        </div>

        <div class="grade-grid">
            <a href="7.html" class="grade-card">
                <span class="emoji">🌱</span>
                <span class="label">پایه هفتم</span>
                <span class="desc">علوم تجربی</span>
                <span class="arrow">←</span>
            </a>

            <a href="8.html" class="grade-card">
                <span class="emoji">🔬</span>
                <span class="label">پایه هشتم</span>
                <span class="desc">علوم تجربی</span>
                <span class="arrow">←</span>
            </a>

            <a href="9.html" class="grade-card">
                <span class="emoji">🧪</span>
                <span class="label">پایه نهم</span>
                <span class="desc">علوم تجربی</span>
                <span class="arrow">←</span>
            </a>
        </div>

        <!-- ===== فوتر ===== -->
        <div class="footer">
            <div class="credit">
                ساخته شده توسط <span class="name">سید آرین عباس‌نژاد</span>
                <br />
                <span class="brand">ARYON مهرآموز</span>
            </div>
        </div>

    </div>
</body>
</html>
